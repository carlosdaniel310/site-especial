<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo(a)</title>
  <link rel="stylesheet" href="style.css">
  <style>


body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #ffe6eb, #fff);
      background: linear-gradient(to bottom, rgba(255, 222, 232, 0.6), rgba(255, 240, 245, 0.6)),
                  url('https://i.gifer.com/2yqT.gif') no-repeat center center fixed;
      background-size: cover;
      color: #6b0023;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.2);
      text-align: center;
      max-width: 400px;
      animation: fadeIn 1.5s ease;
    }

    .login-container h1 {
      margin-bottom: 15px;
      color: #cc2e5d;
    }

    .login-container p {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
    }

    .login-container input {
      padding: 10px;
      width: 80%;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }

    .login-container button {
      background-color: #ff5c8a;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-container button:hover {
      background-color: #e04570;
    }

    .error {
      color: red;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Bem-vindo(a)</h1>
    <p>Digite a senha do coração para continuar...</p>
    <p style="font-size: 0.85rem; color: #888; font-style: italic; margin-top: -10px;">
        A senha é a data da nossa primeira foto.
    </p>
    <input type="password" id="senha" placeholder="Senha do coração">
    <br>
    <button onclick="verificarSenha()">Entrar com amor</button>
    <p id="mensagemErro" style="color: red;"></p>
  </div>

  <script>
    function verificarSenha() {
      const senhaCorreta = "01092024"
      const senha = document.getElementById("senha").value; // Você pode mudar isso para qualquer senha

      if (senha === senhaCorreta) {
        window.location.href = window.location.href = "https://carlosdaniel310.github.io/site-especial/";
      } else {
        document.getElementById("mensagem").innerText = "Essa não é a data da nossa primeira foto...";
      }
    }
  </script>

</body>
</html>
